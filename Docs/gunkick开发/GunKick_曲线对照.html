<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Gun Kick 曲线对照</title>
<style>
body{font:14px/1.5 system-ui,sans-serif;background:#101722;color:#e7edf5;margin:24px;max-width:1300px}h1{margin:0 0 8px}p{color:#aebccd}input,select,button{background:#1b2736;color:#e7edf5;border:1px solid #536478;border-radius:4px;padding:6px;margin:3px}#plot{width:100%;height:540px;background:#172130;border:1px solid #425269}#legend{display:flex;gap:18px;flex-wrap:wrap}.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:14px 0}small{color:#aebccd}
</style>
<h1>Gun Kick · 镜头与枪体同轴复盘</h1>
<p>在 PIE 中设 <code>Lyra.Recoil.VisualTrace 1</code>，录制单发、三连发或连发；设为 0 后执行 <code>Lyra.Recoil.VisualDump</code>，载入 Saved/GunKickTrace_*.csv。可同时载入多个文件比较 30/60/120 FPS。文件只在本机浏览器中读取。</p>
<div class="row"><label>CSV 文件 <input id="files" type="file" accept=".csv,text/csv" multiple></label><label>镜头通道 <select id="camera"><option>CameraPitch</option><option>CameraYaw</option><option>CameraRoll</option></select></label><label>枪体通道 <select id="visual"><option>VisualPitch</option><option>VisualYaw</option><option>VisualRoll</option><option>VisualBackCm</option><option>VisualUpCm</option><option>VisualSideCm</option><option>TargetAlpha</option><option>DirectHandAlpha</option><option>LeftHandAlpha</option></select></label><label><input id="normalize" type="checkbox">各文件从首帧对齐</label></div>
<div id="legend"></div><svg id="plot" viewBox="0 0 1200 540" preserveAspectRatio="none" aria-label="镜头与枪体曲线图"></svg><small id="status">等待 CSV。纵轴共用数值刻度；旋转为度，位移为厘米，Alpha 为 0–1。不同单位对照时请按图例判断。</small>
<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';let runs=[];
const colors=['#7bdff2','#ffb86b','#b28dff','#7ee0a4','#f27c9b','#f4d35e'];
function el(tag,attrs){let x=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x}
function parse(text,name){let lines=text.trim().split(/\r?\n/),head=lines.shift().split(',');let need=['TimeSeconds','ShotSerial','ShotIndex','CameraPitch','CameraYaw','CameraRoll','VisualPitch','VisualYaw','VisualRoll','VisualBackCm','VisualUpCm','VisualSideCm','TargetAlpha','DirectHandAlpha','LeftHandAlpha'];if(need.some(k=>!head.includes(k)))throw Error(name+'：缺少 V4 CSV 列');let rows=lines.map(line=>{let a=line.split(','),o={};head.forEach((k,i)=>o[k]=k==='Profile'?a[i]:Number(a[i]));return o}).filter(x=>Number.isFinite(x.TimeSeconds));if(!rows.length)throw Error(name+'：无有效采样');return {name,rows}}
function draw(){let svg=$('plot');svg.replaceChildren();$('legend').replaceChildren();if(!runs.length)return;let ck=$('camera').value,vk=$('visual').value,align=$('normalize').checked;let all=runs.flatMap(r=>r.rows.map(x=>({t:x.TimeSeconds-(align?r.rows[0].TimeSeconds:0),c:x[ck],v:x[vk]})));let xmin=Infinity,xmax=-Infinity,ymin=0,ymax=0;for(const x of all){xmin=Math.min(xmin,x.t);xmax=Math.max(xmax,x.t);ymin=Math.min(ymin,x.c,x.v);ymax=Math.max(ymax,x.c,x.v)}if(xmax===xmin)xmax=xmin+1;if(ymax===ymin)ymax=ymin+1;let X=t=>54+(t-xmin)/(xmax-xmin)*1120,Y=v=>498-(v-ymin)/(ymax-ymin)*454;for(let i=0;i<=5;i++){let v=ymin+(ymax-ymin)*i,y=Y(v);svg.append(el('line',{x1:54,x2:1174,y1:y,y2:y,stroke:'#34475c'}));let label=el('text',{x:5,y:y+4,fill:'#aebccd','font-size':12});label.textContent=v.toFixed(2);svg.append(label)}for(let i=0;i<=6;i++){let t=xmin+(xmax-xmin)*i,x=X(t);svg.append(el('line',{x1:x,x2:x,y1:44,y2:498,stroke:'#2c3e52'}));let label=el('text',{x:x-16,y:520,fill:'#aebccd','font-size':12});label.textContent=t.toFixed(2)+'s';svg.append(label)}runs.forEach((r,i)=>{let color=colors[i%colors.length],offset=align?r.rows[0].TimeSeconds:0;for(let [key,dash,opacity] of [[ck,'',1],[vk,'7 4',.95]]){let pts=r.rows.filter(x=>Number.isFinite(x[key])).map(x=>`${X(x.TimeSeconds-offset)},${Y(x[key])}`).join(' ');svg.append(el('polyline',{points:pts,fill:'none',stroke:color,'stroke-width':2,'stroke-dasharray':dash,opacity}))}let last=-1;for(let row of r.rows){if(row.ShotIndex>last){last=row.ShotIndex;if(last>0)svg.append(el('line',{x1:X(row.TimeSeconds-offset),x2:X(row.TimeSeconds-offset),y1:44,y2:498,stroke:color,'stroke-width':1,opacity:.4}))}}let item=document.createElement('span');item.style.color=color;item.textContent=`${r.name}: 实线 ${ck} / 虚线 ${vk} · ${r.rows.length} 帧`;$('legend').append(item)});$('status').textContent=`${runs.length} 组；横轴 ${align?'相对首帧':'World Time'}；竖线标出 ShotIndex 变化。`}
$('files').onchange=async e=>{try{runs=await Promise.all([...e.target.files].map(async f=>parse(await f.text(),f.name)));draw()}catch(err){$('status').textContent=err.message}};['camera','visual','normalize'].forEach(id=>$(id).onchange=draw);
</script></html>
